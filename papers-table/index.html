<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Comparison Table — Agentic AI Survey</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="lang-switch">
      <a id="lang-en" class="active" onclick="setLang('en')">EN</a>
      <a id="lang-zh" onclick="setLang('zh')">ZH</a>
    </div>
    <h1>
      <span class="i18n" data-en="Paper Comparison Table" data-zh="論文比較表">Paper Comparison Table</span>
    </h1>
    <div class="stats" id="stats">
      <span class="i18n" data-en="Loading…" data-zh="載入中…">Loading…</span>
    </div>
    <nav class="back-link">
      <a href="../index-en.html"><span class="i18n" data-en="← Back to main" data-zh="← 回到主頁">← Back to main</span></a>
    </nav>
  </div>

  <div class="subtable-tabs" id="subtableTabs"></div>

  <div class="filter-bar">
    <input type="text" id="search"
      data-i18n-placeholder-en="Search titles, authors, fields…"
      data-i18n-placeholder-zh="搜尋標題、作者、欄位…"
      placeholder="Search titles, authors, fields…">
    <select id="detailFilter">
      <option value="" data-en="All papers" data-zh="全部論文">All papers</option>
      <option value="with" data-en="With deep-dive page" data-zh="有深度頁面">With deep-dive page</option>
      <option value="without" data-en="Without deep-dive page" data-zh="尚無深度頁面">Without deep-dive page</option>
    </select>
  </div>

  <div class="filter-panel">
    <div class="filter-panel-header" id="filterPanelToggle">
      <span class="i18n" data-en="Tag Filters" data-zh="標籤篩選">Tag Filters</span>
      <span class="filter-panel-toggle">▼</span>
    </div>
    <div class="filter-panel-content" id="filterPanelContent" style="display:none;">
      <div class="filter-panel-actions">
        <span id="visibleCount">…</span>
        <button class="clear-filters-btn" id="clearFiltersBtn" style="display:none;">
          <span class="i18n" data-en="Clear all filters" data-zh="清除所有篩選">Clear all filters</span>
        </button>
      </div>
      <div class="filter-groups-grid" id="filterGroups"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table id="paperTable">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer" id="footer"></div>
</div>

<script>
function setLang(l) {
  document.documentElement.lang = l;
  document.querySelectorAll('.i18n').forEach((e) => {
    if (e.dataset[l]) e.innerHTML = e.dataset[l];
  });
  document.querySelectorAll('[data-i18n-placeholder-' + l + ']').forEach((e) => {
    e.placeholder = e.dataset['i18nPlaceholder' + l.charAt(0).toUpperCase() + l.slice(1)];
  });
  document.querySelectorAll('option[data-' + l + ']').forEach((opt) => {
    opt.textContent = opt.dataset[l];
  });
  document.getElementById('lang-en').classList.toggle('active', l === 'en');
  document.getElementById('lang-zh').classList.toggle('active', l === 'zh');
  localStorage.setItem('lang', l);
  document.dispatchEvent(new CustomEvent('langchange', { detail: { lang: l } }));
}
window.__getLang = () => localStorage.getItem('lang') || 'en';
</script>
<script src="script.js"></script>
<script>
(function () {
  const l = localStorage.getItem('lang');
  if (l) setLang(l);
})();
</script>
</body>
</html>
