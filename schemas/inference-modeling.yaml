# Inference Time Modeling & Prediction subtable.
#
# Papers that build analytical/ML/simulation models for LLM inference latency,
# throughput, capacity, accuracy. Vidur, LIFE, Frontier, LLM-Pilot,
# speculative-decoding latency models, GenZ, Marconi, etc.
#
# Inherits universal — these fields are *added on top*, not replacements.

name: inference-modeling
label:
  en: Inference Time Modeling
  zh: 推理時間建模
description:
  en: Analytical, ML-based, and simulation models that predict LLM inference latency, throughput, capacity, or accuracy. Validation methodology and modeling assumptions are first-class.
  zh: 預測 LLM 推理延遲、吞吐量、容量或精度的分析式、ML 型與模擬式模型。驗證方法與建模假設是一等公民。

inherits: [universal]

fields:
  # Modeling methodology (the core classification axis) ─────────────────────
  modeling_approach:
    kind: tags
    width: 170
    group: modeling
    label: { en: Modeling Approach, zh: 建模方法 }
    description:
      en: How latency/accuracy is predicted. The most important classification axis (Vidur=Profile-based ML, LIFE=Analytical, Frontier=Hybrid).
      zh: 如何預測延遲或精度。最重要的分類軸（Vidur=Profile-based ML、LIFE=Analytical、Frontier=Hybrid）。
    canonical_values:
      - Analytical (closed-form)
      - Profile-based ML
      - Hybrid
      - Discrete-event simulation
      - Measurement only
    required: true

  modeling_granularity:
    kind: tags
    width: 150
    group: modeling
    label: { en: Modeling Granularity, zh: 建模粒度 }
    description:
      en: At what level does the model predict? Kernel = single CUDA kernel; Operator = matmul/softmax/etc.; Iteration = one decode step; Request = full prompt→completion; Phase = prefill or decode block; Cluster-level = aggregate cluster behavior.
      zh: 預測的粒度。Kernel = 單個 CUDA kernel；Operator = matmul/softmax 等；Iteration = 單次 decode；Request = 完整 prompt→completion；Phase = prefill/decode block；Cluster-level = 整個叢集的聚合行為。
    canonical_values:
      - Kernel
      - Operator
      - Iteration
      - Request
      - Phase
      - Cluster-level
    required: true

  phase_coverage:
    kind: tags
    width: 140
    group: modeling
    label: { en: Phase Coverage, zh: 階段涵蓋 }
    description:
      en: Does the model handle prefill, decode, both, or is it aware of disaggregated PD/EPD architectures?
      zh: 模型涵蓋 prefill、decode、兩者，或是 disaggregated PD/EPD 架構感知？
    canonical_values:
      - Prefill
      - Decode
      - Both
      - PD-disagg-aware
      - EPD-aware
    required: true

  reported_accuracy:
    kind: text
    width: 150
    group: modeling
    label: { en: Reported Accuracy, zh: 報告精度 }
    description:
      en: 'Quantitative accuracy as reported in the paper. Format suggestions: "MAPE 5%", "max error 12%", "R² 0.98", "Not Reported".'
      zh: '論文回報的量化精度。建議格式：「MAPE 5%」、「max error 12%」、「R² 0.98」、「Not Reported」。'

  # Workload coverage ───────────────────────────────────────────────────────
  workload_family:
    kind: tags
    width: 170
    group: workload
    label: { en: Workload Family, zh: 工作負載類型 }
    description:
      en: Multi-select workload taxonomy. A paper can cover multiple families.
      zh: 多選的工作負載分類。一篇論文可涵蓋多個。
    canonical_values:
      - Dense
      - MoE
      - Multimodal (VL/audio)
      - Agentic
      - Hybrid-attention (SSM+Attn)
      - Reasoning-output
      - Long-context

  models_validated:
    kind: tags
    width: 200
    group: validation
    label: { en: Models Validated, zh: 驗證模型 }
    description:
      en: 'Specific model identifiers the paper validates against. E.g. "Llama-3-8B", "Llama-3-70B", "DeepSeek-V3", "Mixtral-8x7B", "Qwen2.5-VL".'
      zh: '論文具體驗證的模型。例如：「Llama-3-8B」、「Llama-3-70B」、「DeepSeek-V3」、「Mixtral-8x7B」、「Qwen2.5-VL」。'

  precision_coverage:
    kind: tags
    width: 150
    group: validation
    label: { en: Precision Coverage, zh: 精度涵蓋 }
    canonical_values:
      - FP16/BF16
      - FP8
      - NVFP4
      - MXFP4
      - INT8
      - KV-quant (per-channel)
      - KV-quant (per-token)

  parallelism_coverage:
    kind: tags
    width: 150
    group: validation
    label: { en: Parallelism Coverage, zh: 平行化涵蓋 }
    canonical_values:
      - None
      - TP
      - PP
      - SP
      - EP
      - TP+PP
      - Disagg

  # Serving knobs that affect timing ────────────────────────────────────────
  batching_policy:
    kind: tags
    width: 150
    group: modeling
    label: { en: Batching Policy, zh: 批次策略 }
    canonical_values:
      - Static
      - Continuous
      - Chunked-prefill
      - Hybrid

  kv_cache_treatment:
    kind: tags
    width: 170
    group: modeling
    label: { en: KV Cache Treatment, zh: KV Cache 處理 }
    description:
      en: How the model accounts for KV cache. Ignored = model assumes infinite HBM; Modeled (HBM only) = capacity tracked but no hierarchy; Prefix-cache-aware = reuse modeled; Tiered = DRAM/SSD offload; Quantized = compressed KV.
      zh: 模型如何處理 KV cache。Ignored = 假設 HBM 無限；Modeled (HBM only) = 追蹤容量但無層級；Prefix-cache-aware = 建模重用；Tiered = DRAM/SSD offload；Quantized = 壓縮 KV。
    canonical_values:
      - Ignored
      - Modeled (HBM only)
      - Prefix-cache-aware
      - Tiered (DRAM/SSD)
      - Quantized

  # Validation methodology ──────────────────────────────────────────────────
  validation_workloads:
    kind: tags
    width: 170
    group: validation
    label: { en: Validation Workloads, zh: 驗證工作負載 }
    description:
      en: 'Workload sources used for validation. E.g. "Synthetic", "LMSys-Chat-1M", "ShareGPT", "Production trace", "Mooncake trace", "BurstGPT".'
      zh: '驗證用的工作負載來源。例如：「Synthetic」、「LMSys-Chat-1M」、「ShareGPT」、「Production trace」、「Mooncake trace」、「BurstGPT」。'

  tail_latency:
    kind: tags
    width: 150
    group: validation
    label: { en: Tail Latency, zh: 尾延遲 }
    canonical_values:
      - Mean only
      - P95
      - P99
      - Full distribution
      - Theoretical bound

  # Downstream use ──────────────────────────────────────────────────────────
  downstream_use:
    kind: tags
    width: 170
    group: downstream
    label: { en: Downstream Use, zh: 下游用途 }
    description:
      en: What the prediction model is actually used for. LLM-Pilot and GenZ look alike but have very different downstream use.
      zh: 預測模型實際的下游應用。LLM-Pilot 與 GenZ 表面相似但下游用途完全不同。
    canonical_values:
      - None
      - Capacity planning
      - Scheduling
      - Autoscaling
      - Hardware co-design
      - SLO admission

  scope_assumptions:
    kind: text
    width: 240
    bilingual: true
    group: modeling
    label: { en: Scope Assumptions, zh: 範圍假設 }
    description:
      en: 'Explicit limitations / assumptions the paper states (or that the authors should have stated). E.g. "single-stream, eager mode, no quantization", "ignores network latency", "assumes uniform request length".'
      zh: '論文明確宣告的限制或假設（或作者應該說明但沒說的）。例如：「single-stream, eager mode, no quantization」、「忽略網路延遲」、「假設請求長度均勻」。'
