# Universal schema — fields every paper has, regardless of domain.
#
# All other domain schemas (ai-networking.yaml, inference-modeling.yaml, …)
# should declare `inherits: [universal]` to pull these in automatically.
#
# Field kinds:
#   title         — paper title rendered with deep-dive link if editorial exists
#   text          — plain text (can be bilingual: true for {en, zh} objects)
#   tags          — comma-separated string rendered as colored pills
#   venue         — single colored badge with venue_full as tooltip
#   arxiv         — id rendered as link to arxiv.org/abs/<id>
#   affiliations  — comma-split into multiple colored badges
#   link          — text with extracted URL rendered as link badge (open_source)
#   domains       — array of domain tags (special, controls visibility)
#   list          — array of strings rendered as colored pills (e.g. models_validated)
#
# Properties:
#   width             — px width in fixed-layout table
#   bilingual: true   — value is {en: str, zh: str} object
#   canonical_values  — only valid for kind: tags / list; helps tag normalization
#   required: true    — extraction skill must produce a non-empty value (else "Not Specified")
#   group             — visual grouping in filter panel (free-form string)

name: universal
label:
  en: Universal
  zh: 通用

fields:
  # Identity ────────────────────────────────────────────────────────────────
  title:
    kind: title
    width: 260
    label: { en: Title, zh: 標題 }
    required: true

  authors:
    kind: text
    width: 170
    label: { en: Authors, zh: 作者 }

  year:
    kind: text
    width: 80
    label: { en: Date, zh: 日期 }
    description:
      en: 'Publication or arXiv-posting date in YYYY-MM form (e.g. "2024-07"). For arXiv papers the prefix of the arxiv id encodes year-month (2407.NNNNN → 2024-07). Fall back to YYYY only if the month is genuinely unknown.'
      zh: '發表或 arXiv 公開日期，格式為 YYYY-MM（例如 2024-07）。arXiv 論文可直接由 arxiv id 前綴推得（2407.NNNNN → 2024-07）；只有在無法確定月份時才退回到 YYYY。'

  venue:
    kind: venue
    width: 110
    label: { en: Venue, zh: 場域 }

  arxiv:
    kind: arxiv
    width: 90
    label: { en: arXiv, zh: arXiv }

  affiliations:
    kind: affiliations
    width: 170
    label: { en: Affiliations, zh: 單位 }

  # Research focus ──────────────────────────────────────────────────────────
  research_focus:
    kind: tags
    width: 220
    group: identity
    label: { en: Research Focus, zh: 研究範圍 }
    description:
      en: 'Multi-select scope tags — what a reader should see *at a glance* to know whether the paper is relevant. Includes but is not limited to the six common inference-modeling directions (long-context/prefix cache, speculative decoding, reasoning/test-time scaling, MoE serving, multimodal serving, multi-tenant scheduling) plus networking/infrastructure axes. A paper can carry multiple. Use only the canonical values below; never invent new tags here — request a schema change instead.'
      zh: '多選的研究範圍標籤，協助讀者「一眼」判斷論文是否相關。包含但不限於六大常見 inference-modeling 方向（long-context/prefix cache、speculative decoding、reasoning/test-time scaling、MoE serving、multimodal serving、multi-tenant scheduling），並涵蓋網路與基礎設施面向。一篇論文可帶多個標籤；只使用以下 canonical 值，不要自行造新標籤，必要時請改 schema。'
    canonical_values:
      # Serving capabilities
      - LLM serving
      - Long-context / Prefix cache
      - Speculative decoding
      - Reasoning / Test-time scaling
      - MoE serving
      - Multimodal serving
      - Agentic / Workflow serving
      - Multi-tenant scheduling
      - PD disaggregation
      - Continuous batching
      - KV cache offloading
      - KV cache compression
      - Quantization
      - LoRA / Multi-adapter
      # Modeling-specific
      - Length prediction
      - Capacity planning
      - Performance modeling
      - Queueing theory
      - Roofline analysis
      # Networking / infrastructure
      - Datacenter networking
      - RDMA / Transport
      - Congestion control
      - Routing / Load balancing
      - Network topology
      - Collective communication
      - In-network computing
      # System / hardware angles
      - Hardware co-design
      - Energy / Carbon
      - GPU memory tiering
      - Distributed training
    required: true

  # Core insights ───────────────────────────────────────────────────────────
  problem_statement:
    kind: text
    width: 260
    bilingual: true
    group: core_insights
    label: { en: Problem, zh: 問題 }
    description:
      en: 1–2 sentence summary of the specific bottleneck/problem the paper aims to solve. From abstract + first paragraph of §1.
      zh: 1–2 句總結論文要解決的具體瓶頸或問題。來源：abstract + §1 第一段。
    required: true

  key_innovation:
    kind: text
    width: 260
    bilingual: true
    group: core_insights
    label: { en: Innovation, zh: 創新 }
    description:
      en: Primary architectural / algorithmic / system innovation. Name a concrete mechanism, not restate the problem.
      zh: 主要的架構、演算法或系統創新。命名具體機制，不要重述問題。
    required: true

  # Evaluation & results ────────────────────────────────────────────────────
  baselines_compared:
    kind: tags
    width: 170
    group: evaluation_and_results
    label: { en: Baselines, zh: 比較對象 }
    description:
      en: Existing systems / frameworks / algorithms benchmarked against. Comma-separated canonical names.
      zh: 論文比較的既有系統或演算法，以 canonical 名稱逗號分隔。

  key_improvements:
    kind: text
    width: 220
    bilingual: true
    group: evaluation_and_results
    label: { en: Improvements, zh: 改進 }
    description:
      en: Most significant quantitative improvements. Prefer numbers from abstract/conclusion (headline claims).
      zh: 最顯著的量化改進。優先採用 abstract / conclusion 的數字（論文背書的 headline）。

  open_source:
    kind: link
    width: 130
    group: evaluation_and_results
    label: { en: Open Source, zh: 開源 }
    description:
      en: 'Allowed forms: "Yes (URL)", "Yes", "Partial (URL)", "No", "Not Specified".'
      zh: '允許格式：「Yes (URL)」、「Yes」、「Partial (URL)」、「No」、「Not Specified」。'

  # Experimental setup ──────────────────────────────────────────────────────
  evaluation_method:
    kind: tags
    width: 120
    group: experimental_setup
    label: { en: Eval Method, zh: 評估方法 }
    canonical_values:
      - Simulation
      - Hardware Testbed
      - Production Cluster
      - Analytical Model

  # Hardware ────────────────────────────────────────────────────────────────
  compute_memory_hw:
    kind: tags
    width: 180
    group: hardware
    label: { en: Compute & Mem HW, zh: 運算/記憶體 }
    description:
      en: Processors + memory devices. Use canonical manufacturer + model form (e.g. "NVIDIA H100" not "H100 GPU").
      zh: 處理器與記憶體裝置。使用 canonical 形式（如 "NVIDIA H100" 而非 "H100 GPU"）。

  gpu_count:
    kind: text
    width: 110
    group: scale
    label: { en: GPU Count, zh: GPU 數 }
    description:
      en: 'Number + accelerator descriptor. Examples: "8x H100", "20x A800 GPUs (in 10P+10D setup)".'
      zh: '數量 + 加速器描述。例如：「8x H100」、「20x A800 GPUs (in 10P+10D setup)」。'

  node_count:
    kind: text
    width: 90
    group: scale
    label: { en: Node Count, zh: 節點數 }
    description:
      en: 'Number + unit. Examples: "20 nodes", "81 satellites".'
      zh: '數量 + 單位。例如：「20 nodes」、「81 satellites」。'
