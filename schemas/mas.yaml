# MAS subtable — Multi-Agent Systems: cross-agent / cross-context KV-cache reuse,
# per-token selection scoring, and inter-agent KV/latent communication.
#
# Papers where the object of study is state shared BETWEEN agents/contexts: KV
# tensors, hidden states, latent messages, or model weights — plus the machinery
# to reuse, repair, select, decontaminate, or secure that shared state.
# Anchors: KVCOMM, RelayCaching, CacheBlend, KV Packet, KVEraser, TokenDance,
# When Latent Agents Lie, Latent Cache Flow, Dense Heterogeneous Communication.
#
# Inherits universal — these fields are *added on top*, not replacements.

name: mas
label:
  en: MAS
  zh: 多智能體

description:
  en: Cross-agent / cross-context KV-cache reuse, per-token selection scoring, and inter-agent KV/latent/weight communication in multi-agent LLM systems — including repair, decontamination, and integrity/privacy of shared cache state.
  zh: 多智能體 LLM 系統中的跨 agent / 跨 context KV cache 重用、逐 token 選擇評分，以及 agent 間的 KV/latent/權重通訊 —— 涵蓋共享 cache state 的修復、去污染與完整性/隱私。

inherits: [universal]

fields:
  reuse_object:
    kind: tags
    width: 150
    group: mas_core
    label: { en: Reused Object, zh: 重用對象 }
    description:
      en: What state is shared/reused across agents or contexts. Multi-select.
      zh: 在 agent 或 context 間共享/重用的 state 類型，可多選。
    canonical_values:
      - KV tensors
      - Hidden states
      - Latent message
      - Model weights
      - Text
      - Compressed KV
    required: true

  reuse_scope:
    kind: tags
    width: 160
    group: mas_core
    label: { en: Reuse Scope, zh: 重用範圍 }
    description:
      en: The boundary the cache crosses.
      zh: cache 跨越的邊界類型。
    canonical_values:
      - Cross-agent (same backbone)
      - Cross-model (heterogeneous)
      - LoRA / adapter variants
      - Cross-context RAG
      - Cross-request / multi-tenant
      - Cross-position
      - Decode-to-prefill

  repair_mechanism:
    kind: tags
    width: 170
    group: mas_core
    label: { en: Repair Mechanism, zh: 修復機制 }
    description:
      en: How the moved/stale cache is corrected (if at all).
      zh: 對移動後/過時 cache 的修正方式（若有）。
    canonical_values:
      - Selective recompute
      - Position re-alignment (RoPE)
      - Learned fusion / link tokens
      - Soft-token adapter
      - Anchor-offset alignment
      - Learned erasure / mutation
      - None (exact reuse)
      - None (accept approximation)

  selection_signal:
    kind: tags
    width: 170
    group: selection
    label: { en: Selection Signal, zh: 選擇信號 }
    description:
      en: The per-token/head/layer importance signal used to decide what to keep, recompute, or transmit.
      zh: 用來決定保留/重算/傳輸哪些 token/head/layer 的重要性信號。
    canonical_values:
      - Accumulated attention
      - Query-probed attention
      - Draft / lookahead attention
      - Output-perturbation
      - Frequency-domain
      - Learned / distilled scorer
      - Gradient / decision-impact
      - Positional heuristic
      - None

  decontamination:
    kind: tags
    width: 140
    group: selection
    label: { en: Decontamination, zh: 去污染 }
    description:
      en: 'Does the method ESTIMATE and SUBTRACT a sender/prior-context component from borrowed KV before use? This column tracks the open gap. Values: "Subtractive (correctness)", "Subtractive (privacy)", "Recompute-only", "None".'
      zh: '方法是否在使用前，從借來的 KV 估計並「減去」sender/先前 context 的成分？此欄追蹤未被佔據的 gap。值：「Subtractive (correctness)」、「Subtractive (privacy)」、「Recompute-only」、「None」。'
    canonical_values:
      - Subtractive (correctness)
      - Subtractive (privacy)
      - Recompute-only
      - None

  agent_role:
    kind: tags
    width: 150
    group: mas_setup
    label: { en: Agent Role, zh: agent 角色 }
    description:
      en: Which multi-agent role/regime the paper targets or evaluates.
      zh: 論文針對或評測的多 agent 角色/情境。
    canonical_values:
      - Executor / worker
      - Judge / aggregator
      - Planner
      - Coder
      - RAG reader
      - Tool user
      - Generic pipeline

  safety_integrity:
    kind: tags
    width: 160
    group: safety
    label: { en: Safety / Integrity, zh: 安全/完整性 }
    description:
      en: Security property addressed, if any.
      zh: 論文處理的安全性質（若有）。
    canonical_values:
      - Privacy / leakage
      - Timing side-channel
      - Tamper integrity
      - Poisoning / injection
      - Access control / provenance
      - None

  reuse_metric:
    kind: text
    width: 150
    bilingual: true
    group: evaluation_and_results
    label: { en: Reuse/Quality Metric, zh: 重用/品質指標 }
    description:
      en: The paper's headline reuse-rate or quality-preservation claim (e.g. ">80% reuse, no quality loss", "Judge Consistency Rate").
      zh: 論文主打的重用率或品質保持宣稱（例如「>80% reuse、無品質損失」、「Judge Consistency Rate」）。
