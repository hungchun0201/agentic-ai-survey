# AI Networking subtable.
#
# Papers about distributed serving, disaggregated PD/EPD architectures,
# datacenter networking for AI workloads, CXL memory pooling for KV cache,
# space-DC papers, and related. Mooncake, DistServe, MegaScale-Infer,
# CALVO, Alibaba HPN, etc.
#
# Inherits universal — these fields are *added on top*, not replacements.

name: ai-networking
label:
  en: AI Networking
  zh: AI 網路
description:
  en: Distributed serving, disaggregation, datacenter networking, CXL memory pooling, transport/routing/congestion control for AI workloads.
  zh: 分散式 serving、解耦合架構、AI 工作負載的資料中心網路、CXL 記憶體池、傳輸/路由/壅塞控制。

inherits: [universal]

fields:
  ai_task:
    kind: tags
    width: 160
    group: workload
    label: { en: AI Task, zh: AI 任務 }
    canonical_values:
      - LLM Serving
      - AI Model Training
      - Disaggregated Prefill/Decoding
      - MoE Serving
      - Semantic Caching
      - RAG
      - KV Cache Compression
      - Multi-agent Systems
      - AI Inference KV Cache transfer

  traffic_pattern:
    kind: tags
    width: 160
    group: workload
    label: { en: Traffic Pattern, zh: 流量模式 }
    canonical_values:
      - All-to-All
      - AllReduce
      - AllGather
      - ReduceScatter
      - Incast
      - Pipeline Parallelism
      - Tensor Parallelism
      - FSDP
      - Ring-AllReduce
      - Permutation
      - Elephant flows
      - Continuous Batching

  network_topology:
    kind: tags
    width: 140
    group: experimental_setup
    label: { en: Network Topology, zh: 網路拓樸 }
    canonical_values:
      - Fat-Tree
      - Clos
      - Leaf-Spine
      - Rail-optimized
      - Dragonfly
      - Slim Fly
      - Flattened Butterfly
      - 3D Torus
      - Hypercube
      - CXL switch-based shared memory pool
      - +Grid
      - square lattice

  software_simulator:
    kind: tags
    width: 130
    group: experimental_setup
    label: { en: Simulator, zh: 模擬器 }
    description:
      en: 'Specific simulator name(s). E.g. "Vidur", "NS-3", "htsim", "SplitwiseSim", "BookSim", "DRAMSim3".'
      zh: '具體模擬器名稱。例如 "Vidur"、"NS-3"、"htsim"、"SplitwiseSim"、"BookSim"、"DRAMSim3"。'

  network_hw:
    kind: tags
    width: 160
    group: hardware
    label: { en: Network HW, zh: 網路硬體 }
    canonical_values:
      - ConnectX-7
      - ConnectX-5
      - BlueField-3 DPU
      - Pensando DPU
      - AWS EFA
      - Broadcom Thor-2
      - Tomahawk ASICs
      - Tofino
      - Juniper PTX10000
      - Mellanox switches
      - NVSwitch
      - XConn XC50256 CXL switch

  platform:
    kind: tags
    width: 110
    group: hardware
    label: { en: Platform, zh: 平台 }
    canonical_values:
      - AWS
      - Azure
      - GCP
      - Alibaba Cloud
      - CloudLab
      - Chameleon
      - ByteDance internal cluster

  transport_and_interconnect:
    kind: tags
    width: 150
    group: networking_stack
    label: { en: Transport, zh: 傳輸層 }
    canonical_values:
      - RDMA
      - RoCEv2
      - InfiniBand
      - SRD
      - TCP/IP
      - Ethernet
      - CXL.mem
      - CXL 2.0
      - CXL 3.0
      - NVLink
      - PCIe 4.0
      - PCIe 5.0
      - PCIe 7.0
      - Free-Space Optics (FSO)
      - Inter-Satellite Links (ISL)

  routing_and_congestion_control:
    kind: tags
    width: 150
    group: networking_stack
    label: { en: Routing & CC, zh: 路由/壅塞控制 }
    canonical_values:
      - ECMP
      - E-ECMP
      - ECN
      - PFC
      - DCQCN
      - DCTCP
      - Packet Spraying
      - Packet Trimming
