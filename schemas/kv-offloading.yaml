# KV Offloading subtable.
#
# Papers about offloading / tiering / restore of LLM KV cache across the
# memory hierarchy (HBM → host DRAM → local SSD → remote pools), the
# when-to-offload decision policies behind them, and agent-aware KV
# lifecycle management (tool-call gaps, workflow graphs, session reuse).
# Mooncake, CachedAttention, Pensieve, InferCept, Continuum, TokenCake,
# KVFlow, MORI, LMCache, LAMPS, CacheGen, Cake, MatKV, etc.
#
# Inherits universal — these fields are *added on top*, not replacements.

name: kv-offloading
label:
  en: KV Offloading
  zh: KV 卸載
description:
  en: Offloading, tiering, and restore of LLM KV cache across HBM/DRAM/SSD; when-to-offload decision policies; agent-aware KV lifecycle management.
  zh: LLM KV cache 在 HBM/DRAM/SSD 層級間的卸載、分層與回填；何時卸載的決策策略；agent 感知的 KV 生命週期管理。

inherits: [universal]

fields:
  offload_trigger:
    kind: text
    width: 200
    group: offload_policy
    label: { en: Offload Trigger, zh: 卸載觸發 }
    description:
      en: 'What event or condition triggers the offload. Examples: turn end, API/tool-call interception, GPU memory pressure, TTL expiry, workflow step completion, admission decision.'
      zh: '觸發卸載的事件或條件。例如：對話輪結束、API/tool call 攔截、GPU 記憶體壓力、TTL 到期、workflow 步驟完成、admission 決策。'

  granularity:
    kind: tags
    width: 150
    group: offload_policy
    label: { en: Granularity, zh: 粒度 }
    description:
      en: Unit at which KV cache is offloaded / restored / managed.
      zh: KV cache 卸載、回填與管理的單位。
    canonical_values:
      - full context
      - session
      - sequence
      - chunk
      - block
      - layer
      - token

  destination_tiers:
    kind: tags
    width: 170
    group: offload_policy
    label: { en: Destination Tiers, zh: 目的層級 }
    description:
      en: Memory / storage tiers the KV cache is offloaded to.
      zh: KV cache 卸載的記憶體或儲存層級。
    canonical_values:
      - HBM
      - host DRAM
      - local SSD
      - remote DRAM pool
      - remote SSD
      - disaggregated store

  prefetch_signal_timing:
    kind: text
    width: 220
    group: restore_path
    label: { en: Prefetch Signal & Timing, zh: 預取訊號與時機 }
    description:
      en: 'What signal schedules the restore (upload back to GPU) and when. Examples: reactive on-arrival, job-queue hint, predicted completion deadline, workflow-graph lookahead, pipelined layer-wise overlap.'
      zh: '排程回填（上傳回 GPU）的訊號與時機。例如：請求到達時被動觸發、job queue 提示、預測完成時間、workflow graph 前瞻、layer-wise pipeline 重疊。'

  costs_modeled:
    kind: tags
    width: 190
    group: cost_model
    label: { en: Costs Modeled, zh: 成本建模 }
    description:
      en: Which resource costs the offload/restore decision explicitly models or measures.
      zh: 卸載/回填決策明確建模或量測的資源成本。
    canonical_values:
      - PCIe bandwidth
      - HBM bandwidth
      - host DRAM bandwidth
      - host DRAM capacity
      - GPU FLOPs recompute
      - energy
      - transfer-vs-recompute crossover
      - queueing delay

  agent_awareness:
    kind: text
    width: 200
    group: workload
    label: { en: Agent Awareness, zh: Agent 感知 }
    description:
      en: 'What agent/workload structure the system exploits. Examples: none (plain chat), tool-call gaps, workflow graph, multi-agent sharing, session lifecycle.'
      zh: '系統利用的 agent/工作負載結構。例如：無（一般對話）、tool call 空檔、workflow graph、多 agent 共享、session 生命週期。'

  when_to_offload_rule:
    kind: text
    width: 260
    bilingual: true
    group: offload_policy
    label: { en: When-to-Offload Rule, zh: 何時卸載規則 }
    description:
      en: The paper's core when-to-offload decision rule, stated in one sentence.
      zh: 論文核心的「何時卸載」決策規則，以一句話陳述。
