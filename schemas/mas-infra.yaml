# MAS-infra subtable — systems papers that accelerate or manage the SERVING
# INFRASTRUCTURE under LLM multi-agent workloads: KV-cache reuse/communication,
# shared-prefix kernels, workflow-aware serving/scheduling, agent workload
# characterization, and the emerging control-plane / state-fabric layer.
#
# Anchors: CacheBlend, KVCOMM, Cache-to-Cache, Hydragen, ChunkAttention,
# Parrot, Autellix, KVFlow, TokenCake, Continuum, PBKV, Pythia.
#
# The purpose of this subtable (2026-07): preserve each paper's ACTUAL
# experimental parameters so that our own experiment designs can cite them
# ("KVFlow used X, so we use X") instead of inventing settings.
#
# Inherits universal — these fields are *added on top*, not replacements.

name: mas-infra
label:
  en: MAS Infra
  zh: 多智能體基礎設施

description:
  en: Infrastructure papers for LLM multi-agent workloads — KV-cache reuse and communication, shared-prefix kernels, workflow-aware serving, workload characterization, and control-plane proposals. Columns preserve each paper's exact evaluation setup (models, GPUs, engines, workloads, load-bearing parameters, metric definitions) plus what structural information the system consumes and which assumption dynamic topology breaks.
  zh: 面向 LLM 多智能體工作負載的基礎設施論文 —— KV cache 重用與通訊、共享前綴 kernel、workflow 感知服務層、工作負載特徵分析與 control plane 提案。欄位保存每篇論文的完整評測設定（模型、GPU、引擎、工作負載、關鍵參數、指標定義），以及系統消耗哪些結構資訊、動態拓撲會破壞哪個假設。

inherits: [universal]

fields:
  infra_layer:
    kind: tags
    width: 170
    group: infra_core
    label: { en: Infra Layer, zh: 基礎設施層 }
    description:
      en: Which layer of the serving stack the mechanism lives in. Multi-select.
      zh: 機制位於服務堆疊的哪一層，可多選。
    canonical_values:
      - KV-cache reuse
      - KV communication
      - Shared-prefix kernel
      - Serving / scheduling
      - Workload characterization
      - Control plane / interface
      - State fabric / offload
    required: true

  structural_input:
    kind: tags
    width: 200
    group: infra_core
    label: { en: Structural Input, zh: 結構資訊輸入 }
    description:
      en: What workflow/topology information the system consumes at run time — the information ladder. Multi-select.
      zh: 系統於執行期消耗哪些 workflow/拓撲資訊（資訊階梯），可多選。
    canonical_values:
      - None (reactive)
      - Call history
      - Workflow metadata (IDs)
      - Declared static DAG
      - Agent step graph
      - Predicted graph
      - Exported per-query graph
      - Tool-duration estimate
      - Infra feedback to orchestrator
    required: true

  dynamic_readiness:
    kind: tags
    width: 150
    group: infra_core
    label: { en: Dynamic Ready, zh: 動態就緒度 }
    description:
      en: 'Behavior when the workflow graph changes per query / per round: No (static assumption baked in), Bounded (tolerates limited drift), Reactive (adapts after the fact), Partial (some path handles it), Dynamic-native (designed for it).'
      zh: '當 workflow 圖逐 query／逐輪變動時的表現：No（內建靜態假設）、Bounded（容忍有限漂移）、Reactive（事後適應）、Partial（部分路徑支援）、Dynamic-native（原生設計）。'
    canonical_values:
      - "No"
      - Bounded
      - Reactive
      - Partial
      - Dynamic-native
    required: true

  serving_engine:
    kind: tags
    width: 150
    group: eval_setup
    label: { en: Engine, zh: 服務引擎 }
    description:
      en: Serving engine / framework the implementation builds on (canonical short names).
      zh: 實作所基於的服務引擎/框架（canonical 短名）。
    canonical_values:
      - vLLM
      - SGLang
      - HuggingFace
      - TensorRT-LLM
      - Custom engine
      - Simulator
      - Not Specified

  models_used:
    kind: list
    width: 190
    group: eval_setup
    label: { en: Models, zh: 實驗模型 }
    description:
      en: Exact LLMs used in the paper's evaluation (canonical short names, e.g. "Llama-3.1-8B", "Qwen2.5-32B").
      zh: 論文評測使用的 LLM（canonical 短名，如 "Llama-3.1-8B"、"Qwen2.5-32B"）。
    required: true

  workloads_traces:
    kind: text
    width: 260
    bilingual: true
    group: eval_setup
    label: { en: Workloads / Traces, zh: 工作負載/軌跡 }
    description:
      en: Agent frameworks, benchmarks, or traces driving the evaluation — including workflow shapes (# agents, fan-out) and whether workloads are synthetic or production-derived.
      zh: 驅動評測的 agent 框架、benchmark 或 trace —— 含 workflow 形狀（agent 數、fan-out）以及負載為合成或生產來源。
    required: true

  key_parameters:
    kind: text
    width: 320
    bilingual: true
    group: eval_setup
    label: { en: Key Parameters, zh: 關鍵參數 }
    description:
      en: The load-bearing experimental parameters as stated in the paper — shared-prefix / context lengths (tokens), request rates or concurrency, tool-latency distributions, cache-size pressure, method knobs (recompute ratio, TTL, thresholds, prediction horizon). "Not stated" for anything the paper omits.
      zh: 論文明載的關鍵實驗參數 —— 共享前綴/context 長度（token）、請求速率或併發、工具延遲分布、cache 壓力、方法旋鈕（recompute 比例、TTL、閾值、預測視野）。論文未載者寫 "Not stated"。
    required: true

  metrics_defined:
    kind: text
    width: 220
    bilingual: true
    group: eval_setup
    label: { en: Metrics (as defined), zh: 指標定義 }
    description:
      en: The primary metrics as the paper defines/measures them (e.g. TTFT measured where, hit-rate over what denominator, JCT, goodput).
      zh: 論文定義/量測的主要指標（如 TTFT 於何處量測、hit-rate 分母為何、JCT、goodput）。

  headline_vs_realistic:
    kind: text
    width: 260
    bilingual: true
    group: evaluation_and_results
    label: { en: Headline vs Realistic, zh: 標題數字 vs 現實 }
    description:
      en: The headline speedup/number AND the most conservative / realistic-workload number the paper itself reports (e.g. "KVFlow 1.83-2.19x synthetic large-prefix; 1.08-1.12x realistic agent workload").
      zh: 論文的 headline 數字與其自身回報的最保守／現實負載數字（如「KVFlow 合成大前綴 1.83-2.19x；現實 agent 負載 1.08-1.12x」）。

  key_assumption_dynamic:
    kind: text
    width: 260
    bilingual: true
    group: infra_core
    label: { en: Assumption Dynamic Breaks, zh: 動態拓撲破壞的假設 }
    description:
      en: The specific assumption the mechanism relies on that per-query / per-round topology change violates or weakens.
      zh: 該機制依賴、而逐 query／逐輪拓撲變動會破壞或削弱的具體假設。
