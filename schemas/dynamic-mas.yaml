# Dynamic-MAS subtable — LLM multi-agent systems whose architecture /
# communication topology / workflow is NOT a fixed hand-designed graph or DAG,
# but is decided dynamically: learned, searched, generated, pruned, or adapted
# (offline per-domain, per-query at inference, or per-round during execution).
#
# Anchors: GPTSwarm, AgentPrune, MaAS (agentic supernet), DyLAN, ADAS, AFlow,
# G-Designer, MAS-GPT, ScoreFlow, DynaSwarm, AgentDropout, MASS.
#
# The core question each column answers: HOW is the structure decided —
# over what space, with what signal, and WHEN.
#
# Inherits universal — these fields are *added on top*, not replacements.

name: dynamic-mas
label:
  en: Dynamic MAS
  zh: 動態多智能體架構

description:
  en: LLM-based multi-agent systems with dynamically-determined architecture — the communication graph, team composition, or workflow is learned, searched, generated, or adapted rather than hand-fixed. Columns capture the design space, decision mechanism, optimization signal, and decision timing, plus the exact evaluation setup (benchmarks, backbone models, agent scenario).
  zh: 架構為動態決定的 LLM 多智能體系統 —— 通訊圖、隊伍組成或 workflow 由學習、搜尋、生成或自適應機制決定，而非人工固定。欄位涵蓋設計空間、決策機制、最佳化信號與決策時機，以及完整的評測設定（benchmark、backbone model、agent 情境）。

inherits: [universal]

fields:
  # Override of the universal column: dynamic-MAS improvement claims are
  # number-dense, so the column is wider and records keep the text short
  # (one compact sentence, 1-2 headline numbers).
  key_improvements:
    kind: text
    width: 360
    bilingual: true
    group: evaluation_and_results
    label: { en: Improvements, zh: 改進 }
    description:
      en: One compact sentence with the 1-2 headline numbers (accuracy delta vs named baseline; cost/token saving). No multi-claim paragraphs.
      zh: 一句精簡敘述,僅含 1-2 個 headline 數字(對具名 baseline 的準確率差距;成本/token 節省)。不要多重宣稱的小段落。

  structure_space:
    kind: tags
    width: 180
    group: dynamic_core
    label: { en: Structure Space, zh: 結構空間 }
    description:
      en: WHAT is being decided/searched. Multi-select.
      zh: 被決定/搜尋的對象為何，可多選。
    canonical_values:
      - Edge topology (spatial)
      - Temporal / cross-round edges
      - Team composition (agent set)
      - Workflow code
      - Operator / node graph
      - Prompts (joint)
      - Roles / profiles
      - Termination / depth
    required: true

  decision_mechanism:
    kind: tags
    width: 200
    group: dynamic_core
    label: { en: Decision Mechanism, zh: 決策機制 }
    description:
      en: The algorithm that decides the structure. Multi-select.
      zh: 決定結構的演算法，可多選。
    canonical_values:
      - Policy gradient / REINFORCE
      - Differentiable mask / pruning
      - MCTS / tree search
      - Evolutionary / swarm search
      - Textual gradient (LLM feedback)
      - Trained generator (SFT)
      - Preference optimization (DPO-style)
      - Graph neural generator (GNN/VAE)
      - Supernet controller sampling
      - LLM on-the-fly orchestration
      - Heuristic scoring / ranking
    required: true

  decision_timing:
    kind: tags
    width: 170
    group: dynamic_core
    label: { en: Decision Timing, zh: 決策時機 }
    description:
      en: WHEN the structure is decided. Multi-select ("Offline per-domain, Per-query" = trained offline then query-conditioned at inference).
      zh: 結構於何時決定，可多選（「Offline per-domain, Per-query」= 離線訓練後於推理時依 query 取樣）。
    canonical_values:
      - Offline per-domain
      - Per-query (inference)
      - Per-round / turn-adaptive
      - Static after search
    required: true

  optimization_signal:
    kind: tags
    width: 180
    group: dynamic_core
    label: { en: Optimization Signal, zh: 最佳化信號 }
    description:
      en: The supervision/reward that drives the structure decision.
      zh: 驅動結構決策的監督/獎勵信號。
    canonical_values:
      - Task utility (accuracy)
      - Cost-aware utility
      - Validation-set score
      - Preference pairs
      - Agent-importance score
      - Textual feedback
      - None (zero-shot LLM)

  backbone_models:
    kind: list
    width: 190
    group: eval_setup
    label: { en: Backbone LLMs, zh: 骨幹模型 }
    description:
      en: Exact LLMs used as agent backbones in the paper's experiments (canonical short names, e.g. "gpt-4o-mini", "Llama-3-70B").
      zh: 實驗中作為 agent 骨幹的 LLM（canonical 短名，如 "gpt-4o-mini"、"Llama-3-70B"）。
    required: true

  benchmarks_used:
    kind: tags
    width: 200
    group: eval_setup
    label: { en: Benchmarks, zh: 評測集 }
    description:
      en: Exact benchmarks/datasets evaluated on. Use canonical names; add split/subset in agent_scenario if notable.
      zh: 評測用的 benchmark/資料集（canonical 名稱）；特殊 split/子集寫在 agent_scenario。
    canonical_values:
      - GSM8K
      - MATH
      - MultiArith
      - SVAMP
      - AQuA
      - HumanEval
      - MBPP
      - MMLU
      - ARC
      - HotpotQA
      - TriviaQA
      - GAIA
      - SWE-bench
      - AlfWorld
      - WebShop
      - BigCodeBench
      - LiveCodeBench
      - SRDD
      - Creative Writing
      - Crossword
    required: true

  agent_scenario:
    kind: text
    width: 240
    bilingual: true
    group: eval_setup
    label: { en: Agent Scenario, zh: agent 情境 }
    description:
      en: Concrete setup — number of agents, roles, tools, notable split/protocol details (e.g. optimized on which split), single-domain vs general assistant.
      zh: 具體設定 —— agent 數量、角色、工具、值得注意的 split/協定細節（例如在哪個 split 上最佳化）、單一領域或通用助理。
    required: true

  accept_tier:
    kind: tags
    width: 130
    group: identity
    label: { en: Accept Tier, zh: 錄取層級 }
    description:
      en: 'Verified acceptance tier at the venue: Oral / Spotlight / Poster / Preprint / Unverified. Only fill Oral/Spotlight with explicit evidence (OpenReview or official list).'
      zh: '經查證的錄取層級：Oral / Spotlight / Poster / Preprint / Unverified。Oral/Spotlight 必須有明確證據（OpenReview 或官方名單）。'
    canonical_values:
      - Oral
      - Spotlight
      - Poster
      - Preprint
      - Unverified
